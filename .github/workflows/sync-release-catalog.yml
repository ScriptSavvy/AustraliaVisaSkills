name: Refresh release catalogues

'on':
  release:
    types: [published, edited]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: write

concurrency:
  group: release-catalogues
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'ScriptSavvy/AustraliaVisaSkills'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out main, not a potentially old stable tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Refresh README and changelog from published ZIPs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/sync_catalog.py --root . --write
      - name: Commit only catalogue changes and verify remote contents
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- README.md CHANGELOG.md; then
            printf '%s\n' 'No catalogue changes to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md CHANGELOG.md
          git commit -m 'docs: refresh published skill catalogues'
          git push origin HEAD:main
          git fetch origin main
          git diff --exit-code HEAD origin/main -- README.md CHANGELOG.md
